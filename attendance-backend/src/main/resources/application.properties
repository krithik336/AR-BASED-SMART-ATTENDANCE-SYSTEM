spring.application.name=attendance-backend

# ===========================
# Local .env auto-loading
# ===========================
# Load DB_* and JWT_* values from attendance-backend/.env for local development.
# The file is parsed as Java properties ([.properties] hint). It is optional:
# when missing, values fall back to the real OS environment variables, which
# also take precedence when both are present.
spring.config.import=optional:file:./.env[.properties]

# ===========================
# PostgreSQL Database
# ===========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# Hikari Pool
# ===========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===========================
# File Upload
# ===========================
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=50MB

# ===========================
# JWT
# ===========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===========================
# Vision Service
# ===========================
vision.service.url=http://localhost:8001
vision.service.connect-timeout-ms=3000
vision.service.read-timeout-ms=30000
vision.service.max-attempts=3

# ===========================
# Recognition
# ===========================
# Minimum cosine similarity for a candidate to be considered at all.
app.recognition.threshold=0.6
# Minimum gap between best and second-best candidate (best - second) for a
# match to be accepted as a STRONG PRESENT. Below this margin a matched face
# is flagged REVIEW and left for the teacher. Calibrate on real classroom data.
app.recognition.margin=0.10
app.recognition.embedding-size=512
app.recognition.max-images-per-student=10

# ===========================
# Storage
# ===========================
app.storage.path=./uploads

# ===========================
# CORS
# ===========================
app.cors.allowed-origins=http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:5173,http://192.168.56.1:5173,http://10.201.146.86:5173
# Server
# ===========================
server.port=8080